<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="640" height="360">
  <!-- 8-bit Pixel Art Snake Duel Splash -->

  <!-- Background grid pattern for CRT effect -->
  <defs>
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="2" fill="rgba(0,0,0,0.1)"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="320" height="180" fill="#0a0a1a"/>

  <!-- Grid lines (subtle) -->
  <g stroke="#1a1a3a" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="0" x2="320" y2="0"/>
    <line x1="0" y1="20" x2="320" y2="20"/>
    <line x1="0" y1="40" x2="320" y2="40"/>
    <line x1="0" y1="60" x2="320" y2="60"/>
    <line x1="0" y1="80" x2="320" y2="80"/>
    <line x1="0" y1="100" x2="320" y2="100"/>
    <line x1="0" y1="120" x2="320" y2="120"/>
    <line x1="0" y1="140" x2="320" y2="140"/>
    <line x1="0" y1="160" x2="320" y2="160"/>
  </g>

  <!-- Blue Snake (Player 1 - Left) - Pixel art style -->
  <g filter="url(#glow)">
    <!-- Body segments (8x8 pixels each) -->
    <rect x="20" y="100" width="8" height="8" fill="#1e40af"/>
    <rect x="28" y="100" width="8" height="8" fill="#2563eb"/>
    <rect x="36" y="100" width="8" height="8" fill="#3b82f6"/>
    <rect x="44" y="100" width="8" height="8" fill="#3b82f6"/>
    <rect x="52" y="100" width="8" height="8" fill="#3b82f6"/>
    <rect x="60" y="100" width="8" height="8" fill="#3b82f6"/>
    <rect x="68" y="100" width="8" height="8" fill="#3b82f6"/>
    <!-- Turn up -->
    <rect x="68" y="92" width="8" height="8" fill="#3b82f6"/>
    <rect x="68" y="84" width="8" height="8" fill="#3b82f6"/>
    <rect x="68" y="76" width="8" height="8" fill="#3b82f6"/>
    <!-- Turn right -->
    <rect x="76" y="76" width="8" height="8" fill="#3b82f6"/>
    <rect x="84" y="76" width="8" height="8" fill="#3b82f6"/>
    <rect x="92" y="76" width="8" height="8" fill="#3b82f6"/>
    <rect x="100" y="76" width="8" height="8" fill="#60a5fa"/>
    <!-- Head -->
    <rect x="108" y="76" width="10" height="10" fill="#93c5fd"/>
    <!-- Eye -->
    <rect x="114" y="78" width="3" height="3" fill="#ffffff"/>
    <rect x="115" y="79" width="2" height="2" fill="#000000"/>
  </g>

  <!-- Red Snake (Player 2 - Right) - Pixel art style -->
  <g filter="url(#glow)">
    <!-- Body segments -->
    <rect x="292" y="100" width="8" height="8" fill="#7f1d1d"/>
    <rect x="284" y="100" width="8" height="8" fill="#991b1b"/>
    <rect x="276" y="100" width="8" height="8" fill="#dc2626"/>
    <rect x="268" y="100" width="8" height="8" fill="#dc2626"/>
    <rect x="260" y="100" width="8" height="8" fill="#dc2626"/>
    <rect x="252" y="100" width="8" height="8" fill="#dc2626"/>
    <rect x="244" y="100" width="8" height="8" fill="#dc2626"/>
    <!-- Turn up -->
    <rect x="244" y="92" width="8" height="8" fill="#dc2626"/>
    <rect x="244" y="84" width="8" height="8" fill="#dc2626"/>
    <rect x="244" y="76" width="8" height="8" fill="#dc2626"/>
    <!-- Turn left -->
    <rect x="236" y="76" width="8" height="8" fill="#dc2626"/>
    <rect x="228" y="76" width="8" height="8" fill="#dc2626"/>
    <rect x="220" y="76" width="8" height="8" fill="#dc2626"/>
    <rect x="212" y="76" width="8" height="8" fill="#ef4444"/>
    <!-- Head -->
    <rect x="202" y="76" width="10" height="10" fill="#fca5a5"/>
    <!-- Eye -->
    <rect x="203" y="78" width="3" height="3" fill="#ffffff"/>
    <rect x="203" y="79" width="2" height="2" fill="#000000"/>
  </g>

  <!-- VS text in center with glow -->
  <g filter="url(#glow)">
    <text x="160" y="90" font-family="monospace" font-size="24" font-weight="bold"
          fill="#fbbf24" text-anchor="middle" style="text-shadow: 0 0 10px #fbbf24">
      VS
    </text>
  </g>

  <!-- Food pellet (apple) in center -->
  <g filter="url(#glow)">
    <rect x="156" y="100" width="8" height="8" fill="#22c55e"/>
    <rect x="158" y="98" width="4" height="2" fill="#166534"/>
  </g>

  <!-- Sparks/collision effects -->
  <g fill="#fbbf24" opacity="0.8">
    <rect x="150" y="72" width="4" height="4"/>
    <rect x="166" y="72" width="4" height="4"/>
    <rect x="158" y="66" width="4" height="4"/>
    <rect x="154" y="78" width="2" height="2"/>
    <rect x="164" y="78" width="2" height="2"/>
  </g>

  <!-- Title: SNAKE DUEL (pixel font style) -->
  <g filter="url(#glow)">
    <!-- S -->
    <rect x="70" y="20" width="12" height="4" fill="#10b981"/>
    <rect x="70" y="24" width="4" height="4" fill="#10b981"/>
    <rect x="70" y="28" width="12" height="4" fill="#10b981"/>
    <rect x="78" y="32" width="4" height="4" fill="#10b981"/>
    <rect x="70" y="36" width="12" height="4" fill="#10b981"/>

    <!-- N -->
    <rect x="86" y="20" width="4" height="20" fill="#10b981"/>
    <rect x="90" y="24" width="4" height="4" fill="#10b981"/>
    <rect x="94" y="28" width="4" height="4" fill="#10b981"/>
    <rect x="98" y="20" width="4" height="20" fill="#10b981"/>

    <!-- A -->
    <rect x="110" y="24" width="4" height="16" fill="#10b981"/>
    <rect x="114" y="20" width="4" height="4" fill="#10b981"/>
    <rect x="118" y="24" width="4" height="16" fill="#10b981"/>
    <rect x="114" y="30" width="4" height="4" fill="#10b981"/>

    <!-- K -->
    <rect x="126" y="20" width="4" height="20" fill="#10b981"/>
    <rect x="130" y="28" width="4" height="4" fill="#10b981"/>
    <rect x="134" y="24" width="4" height="4" fill="#10b981"/>
    <rect x="134" y="32" width="4" height="4" fill="#10b981"/>
    <rect x="138" y="20" width="4" height="4" fill="#10b981"/>
    <rect x="138" y="36" width="4" height="4" fill="#10b981"/>

    <!-- E -->
    <rect x="146" y="20" width="4" height="20" fill="#10b981"/>
    <rect x="150" y="20" width="8" height="4" fill="#10b981"/>
    <rect x="150" y="28" width="6" height="4" fill="#10b981"/>
    <rect x="150" y="36" width="8" height="4" fill="#10b981"/>

    <!-- Space -->

    <!-- D -->
    <rect x="170" y="20" width="4" height="20" fill="#f97316"/>
    <rect x="174" y="20" width="8" height="4" fill="#f97316"/>
    <rect x="182" y="24" width="4" height="12" fill="#f97316"/>
    <rect x="174" y="36" width="8" height="4" fill="#f97316"/>

    <!-- U -->
    <rect x="190" y="20" width="4" height="16" fill="#f97316"/>
    <rect x="202" y="20" width="4" height="16" fill="#f97316"/>
    <rect x="194" y="36" width="8" height="4" fill="#f97316"/>

    <!-- E -->
    <rect x="210" y="20" width="4" height="20" fill="#f97316"/>
    <rect x="214" y="20" width="8" height="4" fill="#f97316"/>
    <rect x="214" y="28" width="6" height="4" fill="#f97316"/>
    <rect x="214" y="36" width="8" height="4" fill="#f97316"/>

    <!-- L -->
    <rect x="226" y="20" width="4" height="20" fill="#f97316"/>
    <rect x="230" y="36" width="8" height="4" fill="#f97316"/>
  </g>

  <!-- Subtitle -->
  <text x="160" y="55" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">
    AI-POWERED 1v1 BATTLE ROYALE
  </text>

  <!-- Bottom decorative border -->
  <g fill="#374151">
    <rect x="0" y="160" width="320" height="2"/>
    <rect x="40" y="164" width="8" height="8" fill="#3b82f6"/>
    <rect x="56" y="164" width="8" height="8" fill="#3b82f6"/>
    <rect x="72" y="164" width="8" height="8" fill="#3b82f6"/>
    <rect x="240" y="164" width="8" height="8" fill="#dc2626"/>
    <rect x="256" y="164" width="8" height="8" fill="#dc2626"/>
    <rect x="272" y="164" width="8" height="8" fill="#dc2626"/>
  </g>

  <!-- Scanline overlay -->
  <rect width="320" height="180" fill="url(#scanlines)" opacity="0.3"/>

  <!-- CRT vignette effect -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.4)"/>
    </radialGradient>
  </defs>
  <rect width="320" height="180" fill="url(#vignette)"/>
</svg>
